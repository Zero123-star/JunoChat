name: JunoChat CI/CD Pipeline

on:
  push:
    branches: [ main, frontend, backend---django, photobooth ]
  pull_request:
    branches: [ main, frontend, backend---django ]

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # FRONTEND TESTING & BUILD
  # ============================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JunoChat-frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./JunoChat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: npm run test -- --reporter=verbose --run

      - name: Run tests with coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: ./JunoChat-frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: ./JunoChat-frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./JunoChat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./JunoChat-frontend/dist/
          retention-days: 7

  # ============================================
  # BACKEND TESTING
  # ============================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: junochat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ./backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run Django checks
        run: python manage.py check
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/junochat_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'false'

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/junochat_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'false'

      - name: Run tests
        run: |
          python manage.py test api --verbosity=2
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/junochat_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'false'

  # ============================================
  # SECURITY SCANNING
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit (Frontend)
        run: |
          cd JunoChat-frontend
          npm audit --audit-level=high || true
        continue-on-error: true

      - name: Setup Python for safety check
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check Python dependencies for vulnerabilities
        run: |
          pip install safety
          cd backend
          safety check -r requirements.txt --full-report || true
        continue-on-error: true

  # ============================================
  # CODE QUALITY
  # ============================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: |
          cd JunoChat-frontend
          npm ci

      - name: TypeScript type check
        run: |
          cd JunoChat-frontend
          npx tsc --noEmit
        continue-on-error: true

  # ============================================
  # DEPLOY TO STAGING (on main branch push)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./dist

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Frontend artifacts ready for deployment"
          echo "Backend ready for deployment"
          # Add your deployment commands here
          # e.g., rsync, scp, docker push, etc.

  # ============================================
  # DEPLOY TO PRODUCTION (on release)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./dist

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          # Add production deployment commands
          # This step requires manual approval in GitHub settings
