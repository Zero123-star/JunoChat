databases:
  - name: junochat-db
    plan: free
    databaseName: junochat
    user: junochat

services:
  # Backend Django API
  - type: web
    name: junochat-api
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      pip install gunicorn whitenoise
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn Django_MDS.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: junochat-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost"
    healthCheckPath: /api/

  # Frontend React/Vite
  - type: web
    name: junochat-frontend
    runtime: static
    rootDir: JunoChat-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://junochat-api.onrender.com
